name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips e2e, so marking it ready has to run it.
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub's merge queue for main. A merge group runs the same fast gate as a pull request.
  merge_group:
  # The full e2e suite every night, so flaky or environment-dependent failures show up even on
  # days when nothing merges.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Branch protection on main requires the `unit`, `e2e` and `visual` checks, and all three report on
# pull requests and merge groups. `unit` and `visual` always run in full. `e2e` always reports, but
# on a pull request it runs Playwright only when the PR is ready for review (not a draft), targets
# main, and touches a path in `scripts/e2e-paths.ts` (src/, public/, tests/e2e/, tests/helpers/,
# Vite, Playwright and npm config, this workflow). Drafts and PRs stacked on another branch iterate
# without it. Pull requests and merge groups run only the smoke subset, the tests tagged `@smoke`
# (`--grep @smoke`), on one job. Pushes to main, the nightly schedule and manual runs always run the
# full suite, split across four shards (file groups in `scripts/e2e-shards.ts`). When main's full
# run fails, the merge queue pauses until the failure is fixed or the culprit PR is reverted
# (CLAUDE.md, "Tests").
# The `perf` project is not gated: it measures GPU throughput, which the runner's SwiftShader
# cannot reach. Run `npm run test:perf` by hand on a machine with a real GPU.

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e-paths:
    name: e2e paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      # The e2e-shard matrix: the smoke job for pull requests and merge groups, else the four shards.
      shards: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["smoke"]' || '[1, 2, 3, 4]' }}
    env:
      # Only a pull request that is ready to merge into main can need the suite.
      CANDIDATE: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' }}
    steps:
      - name: Checkout the path filter
        if: env.CANDIDATE == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/e2e-paths.ts
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        if: env.CANDIDATE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether e2e runs
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then
            echo "A merge group always runs the @smoke subset."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "$EVENT always runs the full e2e suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Draft pull request: the suite runs when it is marked ready for review." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE" != "main" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Stacked on $BASE: the suite runs once the pull request targets main and gets a new commit." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Old and new names, so a rename out of a trigger path still counts.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > files.tsv
          listed=$(wc -l < files.tsv)
          # The files API lists at most 3,000 files. Run everything rather than guess.
          if [ "$listed" -lt "$CHANGED_FILES" ]; then
            echo "Listed $listed of $CHANGED_FILES changed files; running the full e2e suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=$(tr '\t' '\n' < files.tsv \
            | node --experimental-strip-types --no-warnings scripts/e2e-paths.ts)
          echo "$result" | tee -a "$GITHUB_OUTPUT"
          if [ "$result" != "run=true" ]; then
            echo "reason=No e2e trigger path changed (scripts/e2e-paths.ts); the suite was not run." >> "$GITHUB_OUTPUT"
          fi

  e2e-shard:
    name: e2e ${{ matrix.shard == 'smoke' && 'smoke' || format('shard {0}/4', matrix.shard) }}
    needs: e2e-paths
    if: needs.e2e-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-paths.outputs.shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is cached on the @playwright/test version; the system libraries
      # still come from apt on every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Pull requests and merge groups run the tests tagged @smoke. The full shards are file groups
      # from scripts/e2e-shards.ts, balanced on measured durations; Playwright's --shard put every
      # slow export spec on one shard. The blob report is merged into one HTML report by `e2e`.
      - name: End-to-end tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = "smoke" ]; then
            echo "The @smoke subset."
            npm run test:e2e -- --reporter=list,blob --grep @smoke
          else
            specs=$(node --experimental-strip-types --no-warnings scripts/e2e-shards.ts "$SHARD")
            echo "Shard $SHARD: $specs"
            npm run test:e2e -- --reporter=list,blob $specs
          fi

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The required check. It always runs and reports, so a pull request that skips the suite
  # never waits on a missing check.
  e2e:
    name: e2e
    needs: [e2e-paths, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATHS_RESULT: ${{ needs.e2e-paths.result }}
      RUN_E2E: ${{ needs.e2e-paths.outputs.run }}
      SKIP_REASON: ${{ needs.e2e-paths.outputs.reason }}
      SHARDS_RESULT: ${{ needs.e2e-shard.result }}
    steps:
      - name: Check the path filter
        run: |
          if [ "$PATHS_RESULT" != "success" ]; then
            echo "The e2e paths job ended with '$PATHS_RESULT'."
            exit 1
          fi
          if [ "$RUN_E2E" != "true" ]; then
            echo "$SKIP_REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.RUN_E2E == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.RUN_E2E == 'true'
        run: npm ci

      - name: Download blob reports
        if: env.RUN_E2E == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true

      # Prints every shard's results in one list and writes playwright-report/.
      - name: Merge reports
        if: env.RUN_E2E == 'true'
        run: npx playwright merge-reports --reporter=list,html ./all-blob-reports

      - name: Upload test results
        if: env.RUN_E2E == 'true' && (failure() || env.SHARDS_RESULT != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: playwright-report/
          retention-days: 14

      - name: Check shard results
        if: env.RUN_E2E == 'true'
        run: |
          echo "e2e shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = "success"

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is cached on the @playwright/test version; the system libraries
      # still come from apt on every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Visual stills
        run: npm run test:visual

      # Holds the actual, expected and diff PNG of every failing still.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
