name: Visual baselines

# Renders the Linux visual baselines on the same runner image and Chromium build as the
# `visual` CI job, and uploads them as an artifact. It never commits anything: a person
# reviews the PNGs and commits them (tests/visual/README.md).
#
# Run it from the Actions tab (any branch), or push a branch named visual-baselines/<name>.

on:
  workflow_dispatch:
  push:
    branches: ["visual-baselines/**"]

jobs:
  update:
    name: update baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Writes only stills that are missing or no longer match, so unchanged baselines keep
      # their bytes.
      - name: Render baselines
        run: npm run test:visual:update

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/stills.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14
