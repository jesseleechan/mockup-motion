name: Visual baselines

# Renders the Linux visual baselines on the same runner image and Chromium build as the
# `visual` CI job, and uploads them as an artifact. It never commits anything: a person
# reviews the PNGs and commits them (tests/visual/README.md).
#
# Run it from the Actions tab on any branch, or with
# `gh workflow run visual-baselines.yml --ref <branch> [-f fresh=true]`. Pushing a branch named
# visual-baselines/<name> also runs it, but leaves a branch to delete; prefer the dispatch.

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Render every still from scratch, to compare two branches pixel for pixel"
        type: boolean
        default: false
  push:
    branches: ["visual-baselines/**"]

jobs:
  update:
    name: update baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The update below rewrites only stills that are missing or fail the 0.2% tolerance, so
      # a change under the tolerance comes back as the old baseline. Deleting the committed
      # stills first makes it render every one.
      - name: Remove committed baselines
        if: inputs.fresh
        run: rm -f tests/visual/stills.spec.ts-snapshots/*-linux.png

      # Writes only stills that are missing or no longer match, so unchanged baselines keep
      # their bytes.
      - name: Render baselines
        run: npm run test:visual:update

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/stills.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14
