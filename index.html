<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies a saved Light or Dark before first paint, so the page never flashes the other
      // theme. System sets nothing (src/editor/shell/theme-preference.ts).
      (function () {
        try {
          var saved = localStorage.getItem("mockupmotion_theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (err) {
          // Site data is blocked: System applies.
          if (!(err instanceof DOMException)) throw err;
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MockupMotion - Animated Website Mockup Video Creator</title>
    <meta name="description" content="Turn website screenshots into elegant presentation videos. Rendered on your device." />
    <meta property="og:title" content="MockupMotion - Animated Website Mockup Video Creator" />
    <meta property="og:description" content="Turn website screenshots into elegant presentation videos. Rendered on your device." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
